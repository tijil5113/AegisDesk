<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in — AegisDesk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Return to your AegisDesk workspace.">
    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/brand/aegis-mark-app.svg">
    <meta name="theme-color" content="#020617">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/aegis-auth.css">
</head>
<body class="auth-body auth-login">
    <div class="auth-atmosphere" aria-hidden="true">
        <div class="auth-horizon"></div>
        <div class="auth-mark-space">
            <div class="auth-ring"></div>
            <div class="auth-ring"></div>
            <div class="auth-ring"></div>
        </div>
    </div>

    <div class="auth-loading" id="auth-loading" role="status" aria-live="polite" aria-hidden="true">
        <p>Checking your session…</p>
    </div>

    <div class="auth-shell">
        <main class="auth-panel">
            <div class="auth-brand">
                <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
                    <circle class="aegis-mark-ring" cx="32" cy="32" r="27" stroke="currentColor" stroke-width="2.6"/>
                    <path d="M32 14 L18.5 50" stroke="#F8FAFC" stroke-width="3.6" stroke-linecap="round"/>
                    <path d="M32 14 L45.5 50" stroke="#F8FAFC" stroke-width="3.6" stroke-linecap="round"/>
                    <path d="M23.5 36.8 H40.5" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round"/>
                </svg>
                <div>
                    <strong>AegisDesk</strong>
                    <span>Return</span>
                </div>
            </div>
            <h1>Welcome back</h1>
            <p class="auth-lede">Your workspace is waiting. Sign in to continue where you left off.</p>

            <form id="account-login" class="auth-form" novalidate>
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required placeholder="you@example.com">
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <div class="auth-secret">
                        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="Your password">
                        <button class="auth-toggle" id="toggle-password" type="button" aria-pressed="false" aria-controls="password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <button class="auth-submit" type="submit" id="login-submit">
                    <span class="btn-label">Enter AegisDesk</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>
                <div id="login-status" class="auth-status" role="status" aria-live="polite"></div>
            </form>

            <div class="auth-alt">
                <a href="signup.html">Create an account</a>
                <a href="index.html">Back to website</a>
            </div>

            <details class="auth-gate" id="legacy-gate">
                <summary>Workspace access code</summary>
                <p class="auth-hint">For deployments that still use the shared access code.</p>
                <form id="gate-login" class="auth-form">
                    <div class="auth-field">
                        <label for="gate-email">Approved email</label>
                        <input id="gate-email" type="email" autocomplete="username" placeholder="name@example.com">
                    </div>
                    <div class="auth-field">
                        <label for="gate-secret">Access code</label>
                        <div class="auth-secret">
                            <input id="gate-secret" type="password" autocomplete="current-password" placeholder="Access code">
                            <button class="auth-toggle" id="toggle-gate" type="button" aria-pressed="false" aria-controls="gate-secret" aria-label="Show access code">Show</button>
                        </div>
                    </div>
                    <button class="auth-submit" type="submit" id="gate-submit">
                        <span class="btn-label">Continue with access code</span>
                        <span class="btn-spinner" aria-hidden="true"></span>
                    </button>
                    <div id="gate-status" class="auth-status" role="status" aria-live="polite"></div>
                </form>
            </details>
        </main>
    </div>

    <script src="js/auth/aegis-auth-ui.js"></script>
    <script>
        (function () {
            const ui = window.AegisAuthUI;
            const loginForm = document.getElementById('account-login');
            const gateForm = document.getElementById('gate-login');
            const loginStatus = document.getElementById('login-status');
            const gateStatus = document.getElementById('gate-status');
            const loginSubmit = document.getElementById('login-submit');
            const gateSubmit = document.getElementById('gate-submit');
            const loading = document.getElementById('auth-loading');

            ui.bindToggle(document.getElementById('toggle-password'), document.getElementById('password'));
            ui.bindToggle(document.getElementById('toggle-gate'), document.getElementById('gate-secret'));

            function generateSessionId() {
                const bytes = new Uint8Array(6);
                if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
                const hex = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('').toUpperCase();
                return 'AEGIS-' + hex.slice(0, 4) + '-' + hex.slice(4, 8);
            }

            ui.fetchSession().then((data) => {
                if (data && data.authenticated && data.user) {
                    ui.rememberLocalSession(data.user);
                    ui.setStatus(loginStatus, 'You are already signed in. Opening AegisDesk…', 'success');
                    setTimeout(ui.goDesktop, 350);
                    return;
                }
                if (!data || data.gateConfigured === false) {
                    const gate = document.getElementById('legacy-gate');
                    if (gate && data && data.accountsConfigured) gate.hidden = true;
                }
            });

            loginForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                ui.setStatus(loginStatus, '');
                ui.setBusy(loginSubmit, true);
                const email = document.getElementById('email').value.trim().toLowerCase();
                const password = document.getElementById('password').value;
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await ui.readJson(response);
                    if (!response.ok) {
                        ui.setStatus(loginStatus, data.error || 'Could not sign in.', 'error');
                        return;
                    }
                    ui.rememberLocalSession(data.user || { email });
                    ui.setStatus(loginStatus, 'Signed in. Opening your workspace…', 'success');
                    setTimeout(ui.goDesktop, 280);
                } catch (_) {
                    ui.setStatus(loginStatus, 'Could not reach AegisDesk. Start the server and try again.', 'error');
                } finally {
                    ui.setBusy(loginSubmit, false);
                }
            });

            gateForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                ui.setStatus(gateStatus, '');
                ui.setBusy(gateSubmit, true);
                const email = document.getElementById('gate-email').value.trim().toLowerCase();
                const secret = document.getElementById('gate-secret').value.trim();
                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, secret, sessionId: generateSessionId() })
                    });
                    const data = await ui.readJson(response);
                    if (!response.ok) {
                        ui.setStatus(gateStatus, data.error || 'Access code login failed.', 'error');
                        return;
                    }
                    ui.rememberLocalSession({ email: data.email || email, displayName: email.split('@')[0], id: data.sessionId });
                    ui.setStatus(gateStatus, 'Access granted. Opening AegisDesk…', 'success');
                    setTimeout(ui.goDesktop, 280);
                } catch (_) {
                    ui.setStatus(gateStatus, 'Could not reach the login service.', 'error');
                } finally {
                    ui.setBusy(gateSubmit, false);
                }
            });

            if (loading) loading.classList.remove('is-on');
        })();
    </script>
</body>
</html>
